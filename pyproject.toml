[project]
name = "training-platform-backend"
version = "0.1.0"
description = "This project will serve as the backend for the platform 777 detailed in the SRS."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "pwdlib[argon2]",
  "pydantic-settings",
  "email-validator",
  "jinja2",
  "weasyprint",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx2",
  "ruff",
]
